<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <title>Chi tiết sản phẩm</title>

    <link rel="stylesheet" href="../color/product-detail.css">

</head>


<body>


    <div id="header"></div>



    <main class="detail-page">


        <div class="detail-container">


            <div class="detail-image">

                <img id="productImage">

            </div>



            <div class="detail-info">


                <h1 id="productName"></h1>


                <p id="productCategory"></p>


                <h2 class="price" id="productPrice">
                </h2>



                <p class="seller">

                    Người đăng:
                    <b id="productSeller"></b>

                </p>



                <div class="rating" id="productRating">
                </div>



                <p class="description" id="productDescription">
                </p>



                <div class="detail-actions">


                    <button id="buyButton" class="buy-btn">

                        Mua sản phẩm

                    </button>



                    <button id="exchangeButton" class="exchange-btn">

                        Trao đổi

                    </button>



                    <button class="contact-btn">

                        Nhắn người bán

                    </button>


                </div>


            </div>



        </div>





        <section class="review">


            <h2>
                Đánh giá sản phẩm
            </h2>



            <div class="star-input">

                ⭐ ⭐ ⭐ ⭐ ⭐

            </div>



            <textarea placeholder="Viết đánh giá..."></textarea>



            <button>
                Gửi đánh giá
            </button>



        </section>

        <div class="contact-overlay" id="contactOverlay">


            <div class="contact-box">


                <button id="closeContact">
                    ×
                </button>



                <h2 id="contactTitle">
                </h2>



                <div class="contact-info">


                    <label>
                        Họ tên
                    </label>

                    <input id="buyerName">



                    <label>
                        Số điện thoại
                    </label>

                    <input id="buyerPhone">



                    <label>
                        Sản phẩm
                    </label>

                    <input id="contactProduct" readonly>



                    <label>
                        Địa chỉ giao dịch
                    </label>

                    <textarea id="contactAddress" placeholder="Nhập địa chỉ giao dịch">
</textarea>



                    <button id="sendRequest">

                        Gửi yêu cầu

                    </button>



                </div>


            </div>


        </div>
    </main>



    <div id="sale"></div>

    <div id="credit"></div>

    <div id="footer"></div>




    <script src="../js/product-data.js"></script>

    <script src="../js/auth.js"></script>

    <script src="../js/product-detail.js"></script>

    <script src="../js/product-list.js"></script>

    <script src="../js/sale.js"></script>

    <script src="../js/credit.js"></script>

    <script src="../js/main.js"></script>


</body>

</html>
